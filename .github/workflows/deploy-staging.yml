name: Deploy to Staging VPS

on:
    push:
        branches: [ "master" ]

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout Code
                uses: actions/checkout@v4

            -   name: Set up JDK 21
                uses: actions/setup-java@v4
                with:
                    java-version: '21'
                    distribution: 'temurin'
                    cache: maven

            # 2. Login to Docker Hub
            -   name: Log in to Docker Hub
                uses: docker/login-action@v3
                with:
                    username: ${{ secrets.DOCKER_USERNAME }}
                    password: ${{ secrets.DOCKER_PASSWORD }}

            # 3. Set up Docker Buildx
            -   name: Set up Docker Buildx
                uses: docker/setup-buildx-action@v3

            # 4. Build the Image and Push to Registry
            -   name: Build and Push Docker Image
                uses: docker/build-push-action@v5
                with:
                    context: .
                    push: true
                    tags: ${{ secrets.DOCKER_USERNAME }}/paridhi-portal:staging
                    cache-from: type=gha
                    cache-to: type=gha,mode=max

            # 5. Send deployment files to the server
            -   name: Copy deployment files
                uses: appleboy/scp-action@v0.1.7
                with:
                    host: ${{ secrets.VPS_IP }}
                    username: ${{ secrets.VPS_USERNAME }}
                    key: ${{ secrets.VPS_SSH_KEY }}
                    source: |
                        docker-compose.staging.yml
                        Caddyfile
                        prometheus-staging.yml
                        loki-config.yaml
                        grafana/
                    target: "/home/${{ secrets.VPS_USERNAME }}/paridhi-portal-staging"

            # 6. Restart Docker on VPS
            -   name: Restart Docker on VPS
                uses: appleboy/ssh-action@v1.0.3
                with:
                    host: ${{ secrets.VPS_IP }}
                    username: ${{ secrets.VPS_USERNAME }}
                    key: ${{ secrets.VPS_SSH_KEY }}
                    script: |
                        set -e
                        cd /home/${{ secrets.VPS_USERNAME }}/paridhi-portal-staging
                        docker compose -f docker-compose.staging.yml --env-file .env.docker pull
                        docker compose -f docker-compose.staging.yml --env-file .env.docker up -d --remove-orphans
                        docker image prune -f

            # 7. Verify Deployment
            -   name: Verify Deployment
                uses: appleboy/ssh-action@v1.0.3
                with:
                    host: ${{ secrets.VPS_IP }}
                    username: ${{ secrets.VPS_USERNAME }}
                    key: ${{ secrets.VPS_SSH_KEY }}
                    script: |
                        sleep 15
                        curl -f http://localhost:8080/actuator/health || exit 1
                        docker ps