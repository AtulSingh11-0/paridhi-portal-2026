name: Deploy to Staging VPS

on:
    push:
        branches: [ "master" ]

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout Code
                uses: actions/checkout@v4

            -   name: Set up JDK 21
                uses: actions/setup-java@v4
                with:
                    java-version: '21'
                    distribution: 'temurin'
                    cache: maven

            # 2. Login to Docker Hub
            -   name: Log in to Docker Hub
                uses: docker/login-action@v3
                with:
                    username: ${{ secrets.DOCKER_USERNAME }}
                    password: ${{ secrets.DOCKER_PASSWORD }}

            # 3. Build the Image and Push to Registry
            -   name: Build and Push Docker Image
                uses: docker/build-push-action@v5
                with:
                    context: .
                    push: true
                    tags: ${{ secrets.DOCKER_USERNAME }}/paridhi-portal:staging

            # 4. Send ONLY the compose/env files to the server
            -   name: Copy docker-compose and env file to VPS
                uses: appleboy/scp-action@v0.1.7
                with:
                    host: ${{ secrets.VPS_IP }}
                    username: ${{ secrets.VPS_USERNAME }}
                    key: ${{ secrets.VPS_SSH_KEY }}
                    source: "docker-compose.staging.yml,.env.docker,Caddyfile,prometheus-staging.yml,grafana/"
                    target: "/root/paridhi-portal-staging"

            -   name: Restart Docker on VPS
                uses: appleboy/ssh-action@v1.0.3
                with:
                    host: ${{ secrets.VPS_IP }}
                    username: ${{ secrets.VPS_USERNAME }}
                    key: ${{ secrets.VPS_SSH_KEY }}
                    script: |
                        cd /root/paridhi-portal-staging
                        docker compose -f docker-compose.staging.yml --env-file .env.docker down --rmi local
                        docker compose -f docker-compose.staging.yml --env-file .env.docker pull app
                        docker compose -f docker-compose.staging.yml --env-file .env.docker up -d