name: Deploy to Staging VPS

# This triggers the deployment every time you push to the 'main' branch
on:
    push:
        branches: [ "master" ]

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout Code
                uses: actions/checkout@v4

            -   name: Set up JDK 17
                uses: actions/setup-java@v4
                with:
                    java-version: '21'
                    distribution: 'temurin'
                    cache: maven

            -   name: Build Spring Boot Jar
                run: mvn clean package -DskipTests

            -   name: Copy Jar and Dockerfile to VPS
                uses: appleboy/scp-action@v0.1.7
                with:
                    host: ${{ secrets.VPS_IP }}
                    username: ${{ secrets.VPS_USERNAME }}
                    key: ${{ secrets.VPS_SSH_KEY }}
                    source: "target/*.jar,Dockerfile,docker-compose.yml,.env.docker"
                    target: "/root/paridhi-portal-staging"
                    strip_components: 1

            -   name: Restart Docker on VPS
                uses: appleboy/ssh-action@v1.0.3
                with:
                    host: ${{ secrets.VPS_IP }}
                    username: ${{ secrets.VPS_USERNAME }}
                    key: ${{ secrets.VPS_SSH_KEY }}
                    script: |
                        cd /root/paridhi-portal-staging
                        docker compose down
                        docker compose --env-file .env.docker up -d --build