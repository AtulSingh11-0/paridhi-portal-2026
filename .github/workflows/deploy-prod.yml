name: Deploy to Production VPS

on:
    push:
        branches: [ "prod" ]

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout Code
                uses: actions/checkout@v4

            -   name: Log in to Docker Hub
                uses: docker/login-action@v3
                with:
                    username: ${{ secrets.DOCKER_USERNAME }}
                    password: ${{ secrets.DOCKER_PASSWORD }}

            -   name: Set up Docker Buildx
                uses: docker/setup-buildx-action@v3

            -   name: Build and Push Docker Image
                uses: docker/build-push-action@v5
                with:
                    context: .
                    push: true
                    tags: ${{ secrets.DOCKER_USERNAME }}/paridhi-portal:prod
                    cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/paridhi-portal:buildcache-prod
                    cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/paridhi-portal:buildcache-prod,mode=max

            -   name: Copy files via SSH
                uses: appleboy/scp-action@v0.1.7
                with:
                    host: ${{ secrets.PROD_VPS_IP }}
                    username: ${{ secrets.PROD_VPS_USER }}
                    key: ${{ secrets.PROD_VPS_SSH_KEY }}
                    source: "docker-compose.prod.yml,Caddyfile.prod,prometheus-prod.yml,loki-config.yaml,grafana/"
                    target: "/home/${{ secrets.PROD_VPS_USER }}/paridhi-portal-prod/"

            -   name: Execute Zero-Downtime Deployment
                uses: appleboy/ssh-action@v1.0.3
                with:
                    host: ${{ secrets.PROD_VPS_IP }}
                    username: ${{ secrets.PROD_VPS_USER }}
                    key: ${{ secrets.PROD_VPS_SSH_KEY }}
                    script: |
                        cd /home/${{ secrets.PROD_VPS_USER }}/paridhi-portal-prod/
                        
                        echo "Pulling latest production image..."
                        docker compose -f docker-compose.prod.yml pull
                        
                        echo "Applying rolling update (Zero Downtime)..."
                        # --wait ensures docker-compose waits for Actuator healthchecks before stopping the old replicas
                        docker compose -f docker-compose.prod.yml up -d --wait
                        
                        echo "Cleaning up dangling images..."
                        docker image prune -af
