services:
    mysql:
        image: mysql:8.0
        container_name: paridhi-mysql-prod
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD}
            MYSQL_DATABASE: paridhi_prod_db
            MYSQL_ROOT_HOST: "%"
        ports:
            - "127.0.0.1:3308:3306"  # Bind to localhost for security
        volumes:
            - mysql-data:/var/lib/mysql
        networks:
            - paridhi-network
        # Prevents Spring Boot from crashing by telling Docker when the DB is actually ready
        healthcheck:
            test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
            interval: 10s
            timeout: 5s
            retries: 5
        security_opt:
            - no-new-privileges:true

    redis:
        image: redis:7.2-alpine
        container_name: paridhi-redis-prod
        restart: unless-stopped
        command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
        ports:
            - "127.0.0.1:6379:6379"  # Bind to localhost for security
        volumes:
            - redis-data:/data
        networks:
            - paridhi-network
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 10
        security_opt:
            - no-new-privileges:true

    app:
        image: ${DOCKER_USERNAME}/paridhi-portal:staging
#        image: local/paridhi-portal:production
        # Removed container_name so Docker Compose can append indices for replicas
        restart: unless-stopped
#        logging:
#            driver: loki
#            options:
#                loki-url: "http://172.17.0.1:3100/loki/api/v1/push"
#                loki-external-labels: "service=paridhi-portal,environment=prod,container_name={{.Name}}"
        stop_grace_period: 45s
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
            loki:
                condition: service_started
        expose:
            - "8080"
        env_file:
            - .env.prod
        environment:
            - SPRING_PROFILES_ACTIVE=prod
            - SPRING_APPLICATION_NAME=paridhi-portal-2026
            - LOKI_URL=http://loki:3100/loki/api/v1/push
            - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/paridhi_prod_db
            - SPRING_DATA_REDIS_HOST=redis
            - SPRING_DATA_REDIS_PORT=6379
            - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
            - SERVER_FORWARD_HEADERS_STRATEGY=framework
        networks:
            - paridhi-network
        deploy:
            replicas: 3
            update_config:
                order: start-first
                failure_action: rollback
                delay: 10s
            resources:
                limits:
                    memory: 2G
        security_opt:
            - no-new-privileges:true
        healthcheck:
            test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
            interval: 10s
            timeout: 5s
            retries: 5
        read_only: true
        tmpfs:
            - /tmp/spring:size=512M,mode=1777
            - /var/log/spring:size=256M,mode=1777

    promtail:
        image: grafana/promtail:latest
        container_name: paridhi-promtail-prod
        restart: unless-stopped
        command: -config.file=/etc/promtail/config.yml
        volumes:
            - ./promtail-config.yml:/etc/promtail/config.yml
            - /var/lib/docker/containers:/var/lib/docker/containers:ro
            - /var/run/docker.sock:/var/run/docker.sock
        networks:
            - paridhi-network
        security_opt:
            - no-new-privileges:true

    prometheus:
        image: prom/prometheus:latest
        container_name: paridhi-prometheus-prod
        restart: unless-stopped
        command:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            - '--web.console.libraries=/usr/share/prometheus/console_libraries'
            - '--web.console.templates=/usr/share/prometheus/consoles'
            - '--storage.tsdb.retention.time=15d'
        volumes:
            - ./prometheus-prod.yml:/etc/prometheus/prometheus.yml
            - prometheus_data:/prometheus
        networks:
            - paridhi-network
        security_opt:
            - no-new-privileges:true

    loki:
        image: grafana/loki:latest
        container_name: paridhi-loki-prod
        restart: unless-stopped
        command: -config.file=/etc/loki/local-config.yaml
        ports:
            -   "127.0.0.1:3100:3100"
        volumes:
            - ./loki-config.yaml:/etc/loki/local-config.yaml
            - loki_data:/loki
        networks:
            - paridhi-network
        security_opt:
            - no-new-privileges:true
        healthcheck:
            test: ["CMD-SHELL", "grep -q 'ready' <(wget -qO- http://localhost:3100/ready) || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    grafana:
        image: grafana/grafana:latest
        container_name: paridhi-grafana-prod
        restart: unless-stopped
        environment:
            - GF_SECURITY_ADMIN_USER=${SUPER_ADMIN_EMAIL}
            - GF_SECURITY_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD}
            - GF_SERVER_ROOT_URL=${DOMAIN_URL}/grafana
            - GF_SERVER_SERVE_FROM_SUB_PATH=true
        volumes:
            - grafana_data:/var/lib/grafana
            - ./grafana/provisioning:/etc/grafana/provisioning
        networks:
            - paridhi-network
        depends_on:
            - prometheus
            - loki
        expose:
            - "3000"  # Grafana's default port
        security_opt:
            - no-new-privileges:true

    caddy:
        image: caddy:2-alpine
        container_name: paridhi-caddy-prod
        restart: unless-stopped
        environment:
            - DOMAIN_HOST=${DOMAIN_HOST}
            - SERVER_PORT=${SERVER_PORT:-8080}
        ports:
            - "80:80"     # Standard HTTP
            - "443:443"   # Standard HTTPS
        volumes:
            - ./Caddyfile.prod:/etc/caddy/Caddyfile
            - caddy_data:/data
            - caddy_config:/config
        networks:
            - paridhi-network
        depends_on:
            - app
            - grafana
        security_opt:
            - no-new-privileges:true

networks:
    paridhi-network:
        driver: bridge

volumes:
    mysql-data:
    redis-data:
    caddy_data:
    caddy_config:
    prometheus_data:
    loki_data:
    grafana_data:
