spring.profiles.active=${SPRING_PROFILES_ACTIVE}

spring.config.import=optional:file:.env[.properties]

# Application info
spring.application.name=${SPRING_APPLICATION_NAME}

# HikariCP Connection Pool - Common Configuration
spring.datasource.hikari.pool-name=ParidhiHikariPool
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.register-mbeans=true
spring.datasource.hikari.leak-detection-threshold=60000

# Admin user setup
super-admin.default.email=${SUPER_ADMIN_EMAIL}
super-admin.default.password=${SUPER_ADMIN_PASSWORD}
super-admin.default.name=${SUPER_ADMIN_NAME}

# SMTP configuration
spring.mail.host=${EMAIL_HOST}
spring.mail.port=${EMAIL_PORT}
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.debug=true

# Cloudinary configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# ImageKit configuration
imagekit.public-key=${IMAGEKIT_PUBLIC_KEY}
imagekit.private-key=${IMAGEKIT_PRIVATE_KEY}
imagekit.url-endpoint=${IMAGEKIT_URL_ENDPOINT}

image-storage.folder.base=paridhi-2026/

# File upload configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=2MB

# Redis connection properties
spring.cache.type=redis
#spring.data.redis.host=${REDIS_HOST}
#spring.data.redis.port=${REDIS_PORT}
#spring.data.redis.password=${REDIS_PASSWORD}
#spring.cache.redis.time-to-live=${CACHE_TTL}

# Jackson configuration
spring.jackson.serialization.write-dates-as-timestamps=true
spring.jackson.serialization.indent-output=true
spring.jackson.serialization.fail-on-empty-beans=false

spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.deserialization.accept-empty-string-as-null-object=true
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=Asia/Kolkata

# Security headers
server.tomcat.remoteip.remote-ip-header=x-forwarded-for
server.tomcat.remoteip.protocol-header=x-forwarded-proto
server.forward-headers-strategy=NATIVE

# Response compression
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,application/javascript,application/json,application/xml
server.compression.min-response-size=1024

# Session management
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true

# Common logging configuration
logging.level.root=INFO
logging.level.com.megatronix.paridhi=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO

# Swagger UI configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.doc-expansion=none
#springdoc.packages-to-scan=com.megatronix.paridhi.controller
springdoc.paths-to-match=${SWAGGER_PATHS_TO_MATCH}
