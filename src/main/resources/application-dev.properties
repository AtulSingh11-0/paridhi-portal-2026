# Database configuration
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/${SPRING_APPLICATION_NAME:paridhi-portal-2026}?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:12345}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate configuration
spring.jpa.database=mysql
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.generate_statistics=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Development-specific HikariCP settings
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10

# Development-specific JWT settings
jwt.secret=${JWT_SECRET:ZGV2LWp3dC1zZWNyZXQta2V5LXNob3VsZC1iZS12ZXJ5LWxvbmctZm9yLXNlY3VyaXR5LXB1cnBvc2VzLWF0LWxlYXN0LTI1Ni1iaXRz}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Development-specific logging
logging.level.com.megatronix.paridhi=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
logging.level.com.zaxxer.hikari=DEBUG

# Development-specific caching
spring.cache.type=caffeine