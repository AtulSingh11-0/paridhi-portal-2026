    redis:
        image: redis:7.2-alpine
        container_name: paridhi-redis
        restart: unless-stopped
        ports:
            - "6379:6379"
        command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
        volumes:
            - redis-data:/data
        networks:
            - paridhi-network

#    app:
