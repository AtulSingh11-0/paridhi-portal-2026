    prometheus:
        image: prom/prometheus:latest
        container_name: paridhi-prometheus
        restart: unless-stopped
        ports:
            - "9090:9090" # Expose to host so you can view Prometheus UI locally
        volumes:
            - ./prometheus-dev.yml:/etc/prometheus/prometheus.yml
            - prometheus_data:/prometheus
        networks:
            - paridhi-network

    loki:
        image: grafana/loki:latest
        container_name: paridhi-loki
        restart: unless-stopped
        ports:
            - "3100:3100" # Expose to host so IntelliJ app can push logs
        command: -config.file=/etc/loki/local-config.yaml
        volumes:
            - loki_data:/loki
        networks:
            - paridhi-network

    grafana:
        image: grafana/grafana:latest
        container_name: paridhi-grafana
        restart: unless-stopped
        ports:
            - "3000:3000" # Expose to host so you can view Grafana dashboard locally
        environment:
            - GF_SECURITY_ADMIN_USER=${SUPER_ADMIN_EMAIL}
            - GF_SECURITY_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD}
            # Locally, Grafana runs on localhost:3000 without Caddy subpaths
        volumes:
            - grafana_data:/var/lib/grafana
        networks:
            - paridhi-network
        depends_on:
            - prometheus
            - loki

networks:
    paridhi-network:
        driver: bridge

volumes:
    mysql-data:
    redis-data:
    prometheus_data:
    loki_data:
    grafana_data: