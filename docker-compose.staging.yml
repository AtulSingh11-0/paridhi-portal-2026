services:
    mysql:
        image: mysql:8.0
        container_name: paridhi-mysql
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD}
            MYSQL_DATABASE: paridhi_dev_db
        ports:
            -   "127.0.0.1:3306:3306"  # Bind to localhost for security
        volumes:
            - mysql-data:/var/lib/mysql
        networks:
            - paridhi-network
        # Prevents Spring Boot from crashing by telling Docker when the DB is actually ready
        healthcheck:
            test: [ "CMD", "mysqladmin" ,"ping", "-h", "localhost" ]
            interval: 10s
            timeout: 5s
            retries: 5

    redis:
        image: redis:7.2-alpine
        container_name: paridhi-redis
        restart: unless-stopped
        command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
        ports:
            - "127.0.0.1:6379:6379"  # Bind to localhost for security
        volumes:
            - redis-data:/data
        networks:
            - paridhi-network

    app:
        image: ${DOCKER_USERNAME}/paridhi-portal:staging
        container_name: paridhi-portal
        restart: unless-stopped
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_started
        ports:
            - "8080:8080"
        env_file:
            - .env.docker
        environment:
            - SPRING_PROFILES_ACTIVE=staging
            - LOKI_URL=http://localhost:9999/void
            - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/paridhi_dev_db
            - SPRING_DATA_REDIS_HOST=redis
            - SPRING_DATA_REDIS_PORT=6379
            - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
        networks:
            - paridhi-network
        deploy:
            resources:
                limits:
                    memory: 1G

    caddy:
        image: caddy:2-alpine
        container_name: paridhi-caddy
        restart: unless-stopped
        ports:
            - "80:80"     # Standard HTTP
            - "443:443"   # Standard HTTPS
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile
            - caddy_data:/data
            - caddy_config:/config
        networks:
            - paridhi-network
        depends_on:
            - app

networks:
    paridhi-network:
        driver: bridge

volumes:
    mysql-data:
    redis-data:
    caddy_data:
    caddy_config: