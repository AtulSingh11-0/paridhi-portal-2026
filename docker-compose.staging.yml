services:
    mysql:
        image: mysql:8.0
        container_name: paridhi-mysql
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD}
            MYSQL_DATABASE: paridhi_dev_db
        ports:
            - "127.0.0.1:3306:3306"  # Bind to localhost for security
        volumes:
            - mysql-data:/var/lib/mysql
        networks:
            - paridhi-network
        # Prevents Spring Boot from crashing by telling Docker when the DB is actually ready
        healthcheck:
            test: [ "CMD", "mysqladmin" ,"ping", "-h", "localhost" ]
            interval: 10s
            timeout: 5s
            retries: 5
        security_opt:
            - no-new-privileges:true

    redis:
        image: redis:7.2-alpine
        container_name: paridhi-redis
        restart: unless-stopped
        command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
        ports:
            - "127.0.0.1:6379:6379"  # Bind to localhost for security
        volumes:
            - redis-data:/data
        networks:
            - paridhi-network
        security_opt:
            - no-new-privileges:true

    app:
        image: ${DOCKER_USERNAME}/paridhi-portal:staging
        container_name: paridhi-portal
        restart: unless-stopped
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_started
            loki:
                condition: service_started
        ports:
            - "8080"
        env_file:
            - .env.docker
        environment:
            - SPRING_PROFILES_ACTIVE=staging
            - LOKI_URL=http://loki:3100/loki/api/v1/push
            - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/paridhi_dev_db
            - SPRING_DATA_REDIS_HOST=redis
            - SPRING_DATA_REDIS_PORT=6379
            - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
            - SERVER_FORWARD_HEADERS_STRATEGY=framework
        networks:
            - paridhi-network
        deploy:
            resources:
                limits:
                    memory: 1G
        security_opt:
            - no-new-privileges:true
        read_only: true
        tmpfs:
            - /tmp/spring:size=256M
            - /var/log/spring:size=128M

    prometheus:
        image: prom/prometheus:latest
        container_name: paridhi-prometheus
        restart: unless-stopped
        command:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            - '--web.console.libraries=/usr/share/prometheus/console_libraries'
            - '--web.console.templates=/usr/share/prometheus/consoles'
            - '--storage.tsdb.retention.time=7d'
        volumes:
            - ./prometheus-staging.yml:/etc/prometheus/prometheus.yml
            - prometheus_data:/prometheus
        networks:
            - paridhi-network
        security_opt:
            - no-new-privileges:true

    loki:
        image: grafana/loki:latest
        container_name: paridhi-loki
        restart: unless-stopped
        command: -config.file=/etc/loki/local-config.yaml
        volumes:
            - ./loki-config.yaml:/etc/loki/local-config.yaml
            - loki_data:/loki
        networks:
            - paridhi-network
        security_opt:
            - no-new-privileges:true

    grafana:
        image: grafana/grafana:latest
        container_name: paridhi-grafana
        restart: unless-stopped
        environment:
            - GF_SECURITY_ADMIN_USER=${SUPER_ADMIN_EMAIL}
            - GF_SECURITY_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD}
            - GF_SERVER_ROOT_URL=${DOMAIN_URL}/grafana/
            - GF_SERVER_SERVE_FROM_SUB_PATH=true
        volumes:
            - grafana_data:/var/lib/grafana
            - ./grafana/provisioning:/etc/grafana/provisioning
        networks:
            - paridhi-network
        depends_on:
            - prometheus
            - loki
        expose:
            - "3000"  # Grafana's default port
        security_opt:
            - no-new-privileges:true

    caddy:
        image: caddy:2-alpine
        container_name: paridhi-caddy
        restart: unless-stopped
        environment:
            - DOMAIN_HOST=${DOMAIN_HOST}
            - SERVER_PORT=${SERVER_PORT:-8080}
        ports:
            - "80:80"     # Standard HTTP
            - "443:443"   # Standard HTTPS
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile
            - caddy_data:/data
            - caddy_config:/config
        networks:
            - paridhi-network
        depends_on:
            - app
            - grafana
        security_opt:
            - no-new-privileges:true

networks:
    paridhi-network:
        driver: bridge

volumes:
    mysql-data:
    redis-data:
    caddy_data:
    caddy_config:
    prometheus_data:
    loki_data:
    grafana_data: